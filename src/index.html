<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра с гоблинами</title>
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">Игра с гоблинами</h1>
    <div class="score-panel">
      <div class="score-item">
        <span class="score-label">Попадания:</span>
        <span id="score" class="score-value">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Промахи:</span>
        <span id="misses" class="score-value">0</span> / 5
      </div>
    </div>
    <div id="board" class="board"></div>
    <div id="game-over" class="game-over hidden">
      <p class="game-over-text">Игра окончена!</p>
      <p class="game-over-score">Ваш счёт: <span id="final-score">0</span></p>
      <button id="restart" class="restart-btn" type="button">Играть снова</button>
    </div>
    <p class="hint">Успей кликнуть по гоблину, пока он не спрятался! Пропустишь 5 — игра окончена.</p>
  </div>
</body>
</html>
